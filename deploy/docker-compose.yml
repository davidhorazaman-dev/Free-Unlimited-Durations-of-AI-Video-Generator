services:
  api:
    build:
      context: ../backend
    environment:
      PORT: 8787
      HOST: 0.0.0.0
      CORS_ORIGINS: ${CORS_ORIGINS:-https://longestformaiexplainervideogenerator.ai}
    expose:
      - "8787"
    restart: unless-stopped
  web:
    image: nginx:alpine
    depends_on:
      - api
    ports:
      - "8080:80"
    volumes:
      - ..:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
