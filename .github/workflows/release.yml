name: Build and Publish All Packages
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
        default: "1.0.0"
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source archives
        run: |
          mkdir -p out
          git archive --format=zip --output="out/Free-Unlimited-Durations-AI-Video-Generator-Source-Code.zip" HEAD
          git archive --format=tar.gz --output="out/Free-Unlimited-Durations-AI-Video-Generator-Source-Code.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with: {name: source-packages, path: out/*}
  windows:
    runs-on: windows-latest
    strategy:
      matrix: {variant: [standard, portable, full, complete-full]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --upgrade pip pyinstaller
      - name: Build executable
        run: pyinstaller --noconfirm --clean --onefile --name Free-Unlimited-Durations-AI-Video-Generator desktop_launcher.py
      - name: Build Complete Setup
        if: matrix.variant == 'complete-full'
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          iscc packaging/installer.iss
      - name: Assemble Windows package
        shell: pwsh
        env:
          VARIANT: ${{matrix.variant }}
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item dist/*.exe "out/Free-Unlimited-Durations-AI-Video-Generator-Windows-$env:VARIANT.exe"
          Compress-Archive -Path dist/*.exe -DestinationPath "out/Free-Unlimited-Durations-AI-Video-Generator-Windows-$env:VARIANT.zip" -Force
          if ($env:VARIANT -eq "complete-full" -and (Test-Path "Output/*.exe")) { Copy-Item Output/*.exe out/ }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{matrix.variant }}
          path: out/*
  macos:
    strategy:
      matrix:
        include:
          - {arch: arm64, runner: macos-14}
          - {arch: x64, runner: macos-13}
    runs-on: ${{matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --upgrade pip pyinstaller
      - name: Build macOS app
        env:
          ARCH: ${{matrix.arch }}
        run: |
          pyinstaller --noconfirm --clean --windowed --name "Free-Unlimited-Durations-AI-Video-Generator" desktop_launcher.py
          mkdir -p out
          ditto "dist/Free-Unlimited-Durations-AI-Video-Generator.app" "out/Free-Unlimited-Durations-AI-Video-Generator-$ARCH.app"
          ditto -c -k --sequesterRsrc --keepParent "out/Free-Unlimited-Durations-AI-Video-Generator-$ARCH.app" "out/Free-Unlimited-Durations-AI-Video-Generator-macOS-$ARCH.zip"
          tar -czf "out/Free-Unlimited-Durations-AI-Video-Generator-macOS-$ARCH.tar.gz" -C out "Free-Unlimited-Durations-AI-Video-Generator-$ARCH.app"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{matrix.arch }}
          path: out/*
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --upgrade pip pyinstaller
      - name: Build Linux packages
        run: |
          pyinstaller --noconfirm --clean --onefile --name Free-Unlimited-Durations-AI-Video-Generator desktop_launcher.py
          mkdir -p out/bundle
          cp dist/Free-Unlimited-Durations-AI-Video-Generator out/bundle/
          cp README.md LICENSE VERSION index.html styles.css app.js server.py desktop_launcher.py out/bundle/
          chmod +x out/bundle/Free-Unlimited-Durations-AI-Video-Generator
          (cd out && zip -r Free-Unlimited-Durations-AI-Video-Generator-Linux.zip bundle)
          tar -czf out/Free-Unlimited-Durations-AI-Video-Generator-Linux.tar.gz -C out bundle
      - uses: actions/upload-artifact@v4
        with: {name: linux, path: out/*}
  release:
    needs: [source, windows, macos, linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with: {path: release-files, merge-multiple: true}
      - name: Publish GitHub Release
        env: {GH_TOKEN: ${{github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-files/* --repo "${GITHUB_REPOSITORY}" --title "Free Unlimited-Durations AI Video Generator ${GITHUB_REF_NAME}" --generate-notes
